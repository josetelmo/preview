name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "**/*.html"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest

    steps:
      - name: Notify IndexNow about updated public URLs
        env:
          INDEXNOW_KEY: 87f8d6844004b20d3f7a24b0a5d42622
          SITE_URL: https://josetelmo.github.io/preview/
          KEY_LOCATION: https://josetelmo.github.io/preview/87f8d6844004b20d3f7a24b0a5d42622.txt
        run: |
          set -euo pipefail

          echo "Submitting ${SITE_URL} to IndexNow"

          response_code=$(curl \
            --silent \
            --show-error \
            --output /tmp/indexnow-response.txt \
            --write-out "%{http_code}" \
            --get "https://api.indexnow.org/indexnow" \
            --data-urlencode "url=${SITE_URL}" \
            --data-urlencode "key=${INDEXNOW_KEY}" \
            --data-urlencode "keyLocation=${KEY_LOCATION}")

          cat /tmp/indexnow-response.txt || true
          echo
          echo "IndexNow HTTP status: ${response_code}"

          case "${response_code}" in
            200|202)
              echo "IndexNow submission accepted."
              ;;
            *)
              echo "IndexNow submission failed."
              exit 1
              ;;
          esac
